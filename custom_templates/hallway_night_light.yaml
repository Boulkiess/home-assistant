- light:
    - name: "Hallway Night Light"
      unique_id: hallway_night_light_template
      state: "{{ is_state('switch.nous_smart_plug_2', 'on') }}"
      turn_on:
        service: switch.turn_on
        target:
          entity_id: switch.nous_smart_plug_2
      turn_off:
        service: switch.turn_off
        target:
          entity_id: switch.nous_smart_plug_2
