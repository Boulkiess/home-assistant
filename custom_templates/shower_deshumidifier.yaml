- switch:
    - name: "Déshumidificateur"
      unique_id: deshumidificateur_template
      state: "{{ is_state('switch.nous_smart_plug_1', 'on') }}"
      turn_on:
        service: switch.turn_on
        target:
          entity_id: switch.nous_smart_plug_1
      turn_off:
        service: switch.turn_off
        target:
          entity_id: switch.nous_smart_plug_1
