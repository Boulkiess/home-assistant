- id: '1737064501210'
  alias: Desk Auto Lights 2
  description: ''
  triggers:
  - entity_id:
    - binary_sensor.ikea_vallhorn_detector_1_occupancy
    from: 'off'
    to: 'on'
    trigger: state
  - entity_id:
    - binary_sensor.ikea_vallhorn_detector_1_occupancy
    from: 'on'
    to: 'off'
    for:
      hours: 0
      minutes: 5
      seconds: 0
    trigger: state
  conditions:
  - condition: or
    conditions:
    - condition: template
      value_template: '{{ automation_blocker == none }}'
    - condition: template
      value_template: '{{ automation_blocker_boolean and states[automation_blocker].state
        == ''on'' }}'
    - condition: template
      value_template: '{{ not automation_blocker_boolean and states[automation_blocker].state
        == ''off'' }}'
  - condition: template
    value_template: "{% if 'Always' == elevation %}\n  true\n{% else %} {% set sun_elevation
      = state_attr('sun.sun', 'elevation') %} {% if sun_elevation is none %}\n    false\n{%
      else %}\n  {% \n     if (sun_elevation > elevation_adjustment and 'Above horizon'
      == elevation) or\n        (sun_elevation <= elevation_adjustment and 'Below
      horizon' == elevation) %}\n    true\n  {% else %}\n    false\n  {% endif %}\n{%
      endif %} {% endif %}\n"
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.to_state.state == ''on'' }}'
      - condition: numeric_state
        entity_id: sensor.ikea_vallhorn_detector_1_illuminance
        below: 40
      sequence:
      - condition: time
        after: 00:00:00
        before: 00:00:00
      - action: light.turn_on
        data: {}
        target:
          device_id:
          - 62b90b3217eb4061516405b704f815dd
          - b1c603ec6c041c9b06cff4d1fa078164
    - conditions:
      - condition: template
        value_template: '{{ trigger.to_state.state == ''off'' }}'
      - condition: or
        conditions:
        - condition: template
          value_template: '{{ motion_off_blocker == none }}'
        - condition: template
          value_template: '{{ motion_off_blocker_boolean and states[motion_off_blocker].state
            == ''on'' }}'
        - condition: template
          value_template: '{{ not motion_off_blocker_boolean and states[motion_off_blocker].state
            == ''off'' }}'
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ scene_ambient != ''scene.none'' }}'
          - condition: time
            after: 00:00:00
            before: 00:00:00
          sequence:
          - action: scene.turn_on
            target:
              entity_id: scene.none
            data: {}
        default:
        - action: light.turn_off
          data: {}
          target:
            device_id:
            - 62b90b3217eb4061516405b704f815dd
            - b1c603ec6c041c9b06cff4d1fa078164
  mode: restart
  max_exceeded: silent
  variables:
    scene_ambient: scene.none
    automation_blocker:
    automation_blocker_boolean: false
    motion_off_blocker:
    motion_off_blocker_boolean: false
    elevation: Always
    elevation_adjustment: 0
    motion_entity:
    - binary_sensor.ikea_vallhorn_detector_1_occupancy
    luminance_sensor: sensor.ikea_vallhorn_detector_1_illuminance
    luminance_required: 70
